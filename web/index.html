<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI PCB 设计助手</title>
<style>
  :root{
    --bg:#f4f7fb; --panel:#ffffff; --ink:#1f2a37; --muted:#6b7785;
    --line:#e3e9f1; --accent:#2563eb; --accent2:#06b6d4; --ok:#16a34a;
    --warn:#dc2626; --soft:#eef3fb; --shadow:0 6px 22px rgba(31,42,55,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#eef3fb 0%,#f4f7fb 240px);color:var(--ink);min-height:100vh}
  header{padding:26px 28px 14px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:var(--shadow)}
  h1{font-size:21px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .composer{padding:18px;margin-top:8px}
  textarea{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);background:#fbfdff;outline:none}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{font-size:12.5px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;
    color:var(--muted);cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .row{display:flex;align-items:center;gap:18px;margin-top:14px;flex-wrap:wrap}
  .switch{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);user-select:none}
  .switch input{accent-color:var(--accent);width:16px;height:16px}
  .btn{margin-left:auto;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;
    padding:11px 22px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .status{display:none;align-items:center;gap:10px;margin-top:14px;font-size:13.5px;color:var(--muted)}
  .status.show{display:flex}
  .spinner{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;background:#fef2f2;color:#b91c1c;
    border:1px solid #fecaca;font-size:13.5px}
  .err.show{display:block}
  .results{margin-top:22px;display:none}
  .results.show{display:block}
  .meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .badge{font-size:12.5px;padding:5px 11px;border-radius:999px;font-weight:600}
  .badge.llm{background:#e0f2fe;color:#0369a1}
  .badge.mock{background:#f1f5f9;color:#475569}
  .badge.erc0{background:#dcfce7;color:#15803d}
  .badge.ercN{background:#fee2e2;color:#b91c1c}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:9px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .pane{display:none}
  .pane.active{display:block}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;background:var(--soft)}
  tr:hover td{background:#fafcff}
  .net{display:flex;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
  .net .nm{font-weight:600;color:var(--accent);min-width:84px}
  .net .pins{color:var(--ink);flex:1;line-height:1.6}
  .net .cnt{color:var(--muted);font-size:12px}
  .schwrap{position:relative;border:1px solid var(--line);border-radius:10px;background:
    repeating-conic-gradient(#f8fafc 0% 25%,#eef2f7 0% 50%) 50%/22px 22px;overflow:auto;max-height:560px}
  .schwrap .toolbar{position:sticky;top:0;left:0;display:flex;gap:8px;padding:8px;background:rgba(255,255,255,.9);
    border-bottom:1px solid var(--line);z-index:2}
  .toolbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
  .toolbar button:hover{border-color:var(--accent);color:var(--accent)}
  .canvas{transform-origin:0 0;padding:14px}
  .canvas svg{max-width:none}
  .loopitem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13.5px}
  .loopitem .h{display:flex;align-items:center;gap:10px;font-weight:600}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--accent);font-size:13px}
  pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;
    font-size:12px;max-height:320px;overflow:auto}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px}
  code{background:#eef2f7;padding:1px 6px;border-radius:5px;font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">⚡</div>
    <div>
      <h1>AI PCB 设计助手</h1>
      <div class="sub">用自然语言描述需求，自动生成 BOM · 引脚级网表 · KiCad 原理图，并跑 ERC 规则检查</div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card composer">
    <textarea id="prompt" placeholder="例如：帮我设计一块 Arduino 最小系统板（ATmega328P + 稳压 + 复位 + 串口）"></textarea>
    <div class="chips" id="chips">
      <span class="chip">帮我设计一块 Arduino 最小系统板</span>
      <span class="chip">设计一个 ESP32 开发板原理图</span>
      <span class="chip">设计一个 8051 最小系统板</span>
      <span class="chip">设计一个 LM1117 稳压电源模块</span>
    </div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="mock"> 离线模式（无需密钥，用内置示例）</label>
      <label class="switch"><input type="checkbox" id="autofix" checked> 规则检查闭环（ERC 自动修复）</label>
      <button class="btn" id="go">⚡ 生成原理图</button>
    </div>
    <div class="status" id="status"><span class="spinner"></span><span id="statusText">正在设计…</span></div>
    <div class="err" id="err"></div>
  </div>

  <div class="results" id="results">
    <div class="meta" id="meta"></div>
    <div class="tabs">
      <div class="tab active" data-pane="sch">原理图预览</div>
      <div class="tab" data-pane="bom">BOM 清单</div>
      <div class="tab" data-pane="net">引脚级网表</div>
      <div class="tab" data-pane="erc">ERC / 闭环日志</div>
    </div>
    <div class="pane active card" id="pane-sch" style="padding:0">
      <div class="schwrap">
        <div class="toolbar">
          <button data-z="out">－</button>
          <button data-z="in">＋</button>
          <button data-z="fit">适应宽度</button>
          <span class="hint" id="zoomHint">100%</span>
        </div>
        <div class="canvas" id="canvas"></div>
      </div>
      <div class="hint" style="padding:10px 14px">提示：在框内可拖动滚动；缩放按钮调整大小。原理图由 KiCad 导出 SVG。</div>
    </div>
    <div class="pane card" id="pane-bom" style="padding:8px 14px"></div>
    <div class="pane card" id="pane-net" style="padding:8px 14px"></div>
    <div class="pane card" id="pane-erc" style="padding:14px"></div>
  </div>

  <footer>本地运行 · 数据不出本机 · 后端复用与命令行一致的 AI Agent 流水线</footer>
</div>

<script>
const $ = s => document.querySelector(s);
let zoom = 1;

function setStatus(show, text){ const s=$('#status'); s.classList.toggle('show', show); if(text) $('#statusText').textContent=text; }
function showErr(msg){ const e=$('#err'); e.textContent=msg; e.classList.add('show'); }
function hideErr(){ $('#err').classList.remove('show'); }

$('#chips').addEventListener('click', e=>{
  if(e.target.classList.contains('chip')){ $('#prompt').value=e.target.textContent.trim(); }
});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('#pane-'+t.dataset.pane).classList.add('active');
  });
});

$('.schwrap .toolbar').addEventListener('click', e=>{
  const z=e.target.dataset.z; if(!z) return;
  if(z==='in') zoom=Math.min(zoom+0.2,4);
  else if(z==='out') zoom=Math.max(zoom-0.2,0.2);
  else if(z==='fit') zoom=Math.min(1, ($('.schwrap').clientWidth-40)/ ($('#canvas').firstChild? $('#canvas').firstChild.viewBox.baseVal.width:1000));
  $('#canvas').style.transform='scale('+zoom+')';
  $('#zoomHint').textContent=Math.round(zoom*100)+'%';
});

$('#go').addEventListener('click', async ()=>{
  const prompt=$('#prompt').value.trim();
  if(!prompt){ showErr('请先填写设计需求'); return; }
  hideErr(); setStatus(true,'正在调用 AI Agent 设计…（首次约 30–90 秒）');
  $('#go').disabled=true;
  try{
    const resp=await fetch('/api/design',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt, mock:$('#mock').checked, autofix:$('#autofix').checked})});
    const data=await resp.json();
    if(!data.ok){ setStatus(false); showErr('生成失败：'+(data.error||'未知错误')); return; }
    render(data);
    setStatus(false);
    $('#results').classList.add('show');
  }catch(e){ setStatus(false); showErr('网络/服务错误：'+e.message+'（请确认后端 server.py 已启动）'); }
  finally{ $('#go').disabled=false; }
});

function render(d){
  // meta badges
  const src=d.source==='LLM'?'<span class="badge llm">数据来源：LLM</span>':'<span class="badge mock">数据来源：离线知识库</span>';
  let ercBadge='';
  if(d.erc){
    if(d.erc.ok && d.erc.violations===0) ercBadge='<span class="badge erc0">ERC：0 违规 ✓</span>';
    else if(d.erc.violations!=null) ercBadge='<span class="badge ercN">ERC：'+d.erc.violations+' 违规</span>';
    else ercBadge='<span class="badge ercN">ERC：不可用</span>';
  }
  $('#meta').innerHTML=src+ercBadge+'<span class="hint">原理图：'+(d.sch||'')+'</span>';

  // schematic
  const c=$('#canvas'); c.innerHTML='';
  if(d.svg){ const div=document.createElement('div'); div.innerHTML=d.svg; const svg=div.querySelector('svg'); if(svg){ svg.removeAttribute('width'); svg.removeAttribute('height'); svg.style.width='100%'; c.appendChild(svg);} }
  else c.innerHTML='<div class="hint" style="padding:20px">⚠️ 原理图预览失败：'+(d.svg_error||'kicad-cli 不可用或导出失败（请确认本机已安装 KiCad 8）。')+'</div>';
  zoom=1; c.style.transform='scale(1)'; $('#zoomHint').textContent='100%';

  // bom
  const bom=d.bom||{}; const items=bom.items||[];
  let h='<table><thead><tr><th>位号</th><th>符号 (lib_id)</th><th>标称值</th><th>数量</th></tr></thead><tbody>';
  items.forEach(it=>{ h+='<tr><td><b>'+(it.ref||'')+'</b></td><td>'+(it.symbol||'')+'</td><td>'+(it.value||'')+'</td><td>'+(it.qty??1)+'</td></tr>'; });
  h+='</tbody></table>';
  if(bom.project) h='<div class="hint" style="padding:10px 14px 0">项目：'+bom.project+'　共 '+items.length+' 个元器件</div>'+h;
  $('#pane-bom').innerHTML=h;

  // netlist
  const nets=(d.netlist&&d.netlist.nets)||[];
  let n='';
  nets.forEach(nt=>{ const pins=(nt.pins||[]).join('、'); n+='<div class="net"><span class="nm">'+(nt.name||'')+'</span><span class="pins">'+pins+'</span><span class="cnt">'+(nt.pins?nt.pins.length:0)+' 脚</span></div>'; });
  if(!nets.length) n='<div class="hint" style="padding:14px">无网络</div>';
  $('#pane-net').innerHTML=n;

  // erc loop
  let l='';
  (d.loop||[]).forEach(it=>{
    const e=it.erc||{};
    const v = e.ok ? (e.violations+' 条违规') : ('失败：'+(e.error||''));
    l+='<div class="loopitem"><div class="h">第 '+(it.iter+1)+' 轮　<span class="badge '+(e.ok&&e.violations===0?'erc0':'ercN')+'">'+v+'</span></div>';
    if(it.note) l+='<div class="hint">'+it.note+'</div>';
    if(e.report) l+='<details><summary>查看 ERC 报告</summary><pre>'+escapeHtml(e.report)+'</pre></details>';
    l+='</div>';
  });
  if(d.kicad_cli) l+='<div class="hint">kicad-cli：'+d.kicad_cli+'</div>';
  $('#pane-erc').innerHTML=l||'<div class="hint" style="padding:14px">未执行 ERC</div>';

  // 默认显示原理图
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
  document.querySelector('.tab[data-pane="sch"]').classList.add('active');
  $('#pane-sch').classList.add('active');
}

function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
</script>
</body>
</html>
